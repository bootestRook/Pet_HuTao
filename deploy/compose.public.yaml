# Run from the project root with Docker Compose >= 2.24.4:
# docker compose -f compose.yaml -f deploy/compose.public.yaml up -d --build
services:
  app:
    ports: !reset []
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your HTTPS address in .env}
  caddy:
    image: caddy:2-alpine
    init: true
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN to your public domain in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
